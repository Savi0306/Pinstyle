<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinStyle Analytics & Pitch Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.2/umd/Recharts.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { 
            BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer, PieChart, Pie, Cell 
        } = Recharts;

        // Sample Metrics Data
        const executiveMetrics = [
            { label: 'Total Net Revenue', value: '₹3,87,01,050', change: '+24.5%', isPos: true, sub: 'Across 3 launch segments' },
            { label: 'Bundle AOV', value: '₹12,610', change: '+119%', isPos: true, sub: 'vs. ₹5,750 single item baseline' },
            { label: 'Platform Conversion Rate', value: '3.25%', change: '+1.45%', isPos: true, sub: 'Powered by Pinterest visual traffic' },
            { label: 'Avg Items Per Order (IPO)', value: '3.6 Items', change: '+2.2', isPos: true, sub: 'Multi-piece bundle adoption' },
            { label: 'Return Rate Efficiency', value: '14.2%', change: '-8.3%', isPos: true, sub: 'vs 22.5% traditional e-comm' },
            { label: 'Customer Acquisition Cost', value: '₹1,610', change: '-42%', isPos: true, sub: 'Organic Pin viral amplification' },
        ];

        const segmentData = [
            { name: 'Clean Girl', revenue: 13876800, orders: 1960 },
            { name: 'Old Money', revenue: 13009500, orders: 1490 },
            { name: 'Trads', revenue: 11814750, orders: 1310 },
        ];

        const pieData = [
            { name: 'Clean Girl Minimalist', value: 36, color: '#f43f5e' },
            { name: 'Old Money Prep', value: 33, color: '#3b82f6' },
            { name: 'Trads (Heritage)', value: 31, color: '#10b981' },
        ];

        const bundles = [
            {
                id: 'BNDL-001',
                name: 'The Sofia Old Money Set',
                aesthetic: 'Old Money Prep',
                pieces: ['Cream Tailored Blazer', 'Pleated Midi Skirt', 'Leather Bag'],
                price: '₹14,868',
                units: 440,
                revenue: '₹65,41,920',
                returnRate: '9.5%'
            },
            {
                id: 'BNDL-002',
                name: 'Off-Duty Model Everyday Fit',
                aesthetic: 'Clean Girl Minimalist',
                pieces: ['Ribbed Baby Tee', 'Wide-Leg Linen Trousers', 'Gold Hoops'],
                price: '₹10,178',
                units: 610,
                revenue: '₹62,08,275',
                returnRate: '11.2%'
            },
            {
                id: 'BNDL-003',
                name: 'Royal Heritage Handloom Set',
                aesthetic: 'Trads (Heritage)',
                pieces: ['Chanderi Silk Kurta', 'Straight Trousers', 'Organza Dupatta'],
                price: '₹13,718',
                units: 420,
                revenue: '₹57,61,350',
                returnRate: '8.8%'
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedSegment, setSelectedSegment] = useState('All');

            const filteredBundles = selectedSegment === 'All'
                ? bundles
                : bundles.filter(b => b.aesthetic.toLowerCase().includes(selectedSegment.toLowerCase()));

            const filteredChartData = selectedSegment === 'All'
                ? segmentData
                : segmentData.filter(d => d.name.toLowerCase().includes(selectedSegment.toLowerCase()));

            return (
                <div className="min-h-screen p-6">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b border-slate-800 pb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-white">PinStyle Analytics & Pitch Dashboard</h1>
                            <p className="text-slate-400 text-sm">Pinterest-Inspired Outfit Curation Platform | Business Intelligence</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <select 
                                value={selectedSegment}
                                onChange={(e) => setSelectedSegment(e.target.value)}
                                className="bg-slate-900 border border-slate-800 text-slate-300 text-sm rounded-lg px-3 py-2 outline-none focus:border-rose-500"
                            >
                                <option value="All">All Segments (Clean Girl, Trads, Old Money)</option>
                                <option value="Clean Girl">Clean Girl Minimalist</option>
                                <option value="Old Money">Old Money Prep</option>
                                <option value="Trads">Trads (Heritage)</option>
                            </select>
                        </div>
                    </header>

                    {/* Tabs */}
                    <div className="flex border-b border-slate-800 mb-8 gap-8">
                        {['overview', 'bundles', 'pitch'].map((tab) => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`pb-4 text-sm font-medium border-b-2 capitalize transition-colors ${
                                    activeTab === tab
                                        ? 'border-rose-500 text-rose-400'
                                        : 'border-transparent text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                {tab === 'overview' ? 'Executive Dashboard' : tab === 'bundles' ? 'Bundle Performance' : 'Professor Pitch Brief'}
                            </button>
                        ))}
                    </div>

                    {/* Tab Contents */}
                    {activeTab === 'overview' && (
                        <div className="space-y-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                {executiveMetrics.map((m, idx) => (
                                    <div key={idx} className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5">
                                        <div className="text-slate-400 text-sm font-medium mb-2">{m.label}</div>
                                        <div className="text-2xl font-bold text-white tracking-tight mb-1">{m.value}</div>
                                        <div className="text-xs text-emerald-400 font-semibold mb-2">{m.change}</div>
                                        <p className="text-xs text-slate-500">{m.sub}</p>
                                    </div>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6">
                                    <h3 className="text-base font-semibold text-white mb-1">Segment Revenue Comparison (INR ₹)</h3>
                                    <p className="text-xs text-slate-400 mb-6">Net monthly revenue generated by targeted launch aesthetics</p>
                                    <div className="h-64">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={filteredChartData}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                                                <XAxis dataKey="name" stroke="#64748b" fontSize={12} />
                                                <YAxis stroke="#64748b" fontSize={12} tickFormatter={(val) => `₹${(val/100000).toFixed(1)}L`} />
                                                <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff' }} />
                                                <Bar dataKey="revenue" fill="#f43f5e" radius={[6, 6, 0, 0]} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6">
                                    <h3 className="text-base font-semibold text-white mb-1">Aesthetic Revenue Share</h3>
                                    <p className="text-xs text-slate-400 mb-6">Percentage contribution to total store sales</p>
                                    <div className="h-48">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={pieData} cx="50%" cy="50%" innerRadius={50} outerRadius={75} dataKey="value">
                                                    {pieData.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.color} />
                                                    ))}
                                                </Pie>
                                                <Tooltip contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', color: '#fff' }} />
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'bundles' && (
                        <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6">
                            <h3 className="text-base font-semibold text-white mb-1">Top Performing Curated Outfit Bundles</h3>
                            <p className="text-xs text-slate-400 mb-6">Complete ready-to-shop outfit performance across launch aesthetics</p>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-800/50 text-slate-400 uppercase text-xs">
                                        <tr>
                                            <th className="p-3">Bundle Name</th>
                                            <th className="p-3">Aesthetic</th>
                                            <th className="p-3">Included Pieces</th>
                                            <th className="p-3">Price (INR)</th>
                                            <th className="p-3">Units Sold</th>
                                            <th className="p-3">Total Revenue</th>
                                            <th className="p-3">Return Rate</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800 text-slate-300">
                                        {filteredBundles.map((b) => (
                                            <tr key={b.id} className="hover:bg-slate-800/30">
                                                <td className="p-3 font-medium text-white">{b.name}</td>
                                                <td className="p-3"><span className="px-2.5 py-1 bg-slate-800 rounded-full text-xs text-rose-400">{b.aesthetic}</span></td>
                                                <td className="p-3 text-xs text-slate-400">{b.pieces.join(', ')}</td>
                                                <td className="p-3 font-semibold text-white">{b.price}</td>
                                                <td className="p-3">{b.units}</td>
                                                <td className="p-3 font-semibold text-emerald-400">{b.revenue}</td>
                                                <td className="p-3 text-xs text-emerald-400">{b.returnRate}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === 'pitch' && (
                        <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 space-y-6">
                            <h3 className="text-lg font-bold text-white">Academic Pitch Brief for Professor Presentation</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-xl space-y-2">
                                    <div className="text-rose-400 font-semibold text-sm">1. Core Business Value</div>
                                    <p className="text-xs text-slate-300">Removes friction between visual discovery (Pinterest) and transaction by offering full look purchases.</p>
                                </div>
                                <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-xl space-y-2">
                                    <div className="text-rose-400 font-semibold text-sm">2. Financial Lever (AOV Expansion)</div>
                                    <p className="text-xs text-slate-300">Expands Average Order Value to ₹12,610 (vs standard baseline ₹5,750), lowering CAC ratio.</p>
                                </div>
                                <div className="bg-slate-800/40 border border-slate-800 p-4 rounded-xl space-y-2">
                                    <div className="text-rose-400 font-semibold text-sm">3. Inventory Risk Mitigation</div>
                                    <p className="text-xs text-slate-300">Capsule matrix styling shares staple SKUs across different looks, reducing total inventory holding costs.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
